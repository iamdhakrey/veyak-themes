name: Validate Theme Submodules

on:
  pull_request:
    paths:
      - 'extensions/**'
      - '.gitmodules'
      - 'extension.schema.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Validate Schema and Directory Conventions
        run: node scripts/validate.mjs
